<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foreign Exchange Lab – Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--side:#0d7340;--side2:#0a5f35;--accent:#16a85c;--active:#2fb36d;--bg:#eeeeee;--card:#fff;--text:#1b2a22;--muted:#64746b;--line:#d8e0dc;--err:#b3261e;--tint:#e3f4ea;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.45 Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
.card{background:var(--card);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);padding:28px;max-width:760px;margin:0 auto}
h1{font-size:26px;margin:0 0 6px;font-weight:500}h2{font-size:22px;margin:0 0 4px;font-weight:500}h3{font-size:16px;margin:0 0 6px}
p.s{color:var(--muted);margin:0 0 18px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.bt{background:var(--card);border:2px solid var(--text);border-radius:14px;padding:38px 16px;text-align:center;font:inherit;color:var(--text);cursor:pointer;font-size:19px}
.bt:hover{border-color:var(--accent);background:var(--tint)}.bt small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.grid{display:flex;flex-wrap:wrap;gap:18px}
.ses{width:200px;height:130px;background:var(--accent);color:#fff;border-radius:8px;padding:16px;border:0;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end}
.ses b{font-size:18px}.ses span{opacity:.9;font-size:13px}
.new{width:200px;height:130px;border:2px dashed var(--accent);border-radius:8px;background:transparent;color:var(--accent);font:inherit;font-size:16px;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 22px;font:500 14px Roboto,Arial;cursor:pointer}
.btn.off{background:#9fb3a8;color:#eef3f0}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 14px}
.steps{display:flex;align-items:flex-start;margin-bottom:26px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);width:70px}
.st i{width:34px;height:34px;border-radius:50%;background:var(--line);color:var(--muted);display:grid;place-items:center;font-style:normal;font-weight:700}
.st.on i{background:var(--side);color:#fff}.st.on{color:var(--text)}.st.done i{background:var(--accent);color:#fff}
.ln{flex:1;height:3px;background:var(--line);margin-top:16px}.ln.done{background:var(--accent)}
label.l{display:block;font-weight:500;margin:18px 0 6px}
input[type=text],input[type=date],input[type=time]{width:100%;padding:11px 12px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}.opt small{display:block;color:var(--muted)}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 4px}
.pc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);color:var(--text);text-align:left;font:inherit;cursor:pointer}
.pc.on{border:2px solid var(--accent);background:var(--tint)}.pc small{color:var(--muted);display:block}
.acc{border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
.acc>button{width:100%;display:flex;justify-content:space-between;background:var(--card);color:var(--text);border:0;padding:13px 14px;font:inherit;cursor:pointer}
.row{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row label{display:flex;gap:8px;align-items:center}.row span input[readonly]{opacity:.5;cursor:not-allowed}.hint{grid-column:1/-1;display:none;background:#fff4e0;color:#7a4b00;border-radius:6px;padding:5px 10px;font-size:13px}.hint.on{display:block}
.row span input{width:70%;border:0;border-bottom:1px solid var(--muted);border-radius:0;padding:4px;background:transparent;color:var(--text);font:inherit}
.sum{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:20px}
.chip{display:inline-block;background:var(--tint);border-radius:12px;padding:2px 10px;margin:3px 4px 0 0;font-size:13px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px}
.err{color:var(--err);font-size:14px;min-height:20px;text-align:right;margin-top:8px}
.rv{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;display:flex;justify-content:space-between;gap:12px}
.rv small{color:var(--muted);display:block;font-size:12px}.ed{color:var(--side);background:none;border:0;font:500 14px Roboto;cursor:pointer;height:fit-content}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:18px 0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;font:inherit;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--text);border-color:var(--accent);font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:none;border:0;font-size:22px;color:var(--side);cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20}
.mo div{background:var(--card);border-radius:12px;padding:28px 34px;text-align:center;max-width:90%}
.code{font-size:40px;letter-spacing:6px;font-weight:700;color:var(--side);margin:10px 0 18px}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2a22;color:#fff;padding:12px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;text-align:center}
#t.on{opacity:1}
#page{padding:40px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(10,40,25,.55);display:grid;place-items:center;padding:16px;z-index:10}.ov.hide{display:none}
.pop{background:var(--card);border-radius:16px;width:min(760px,100%);max-height:100%;overflow-y:auto;padding:0 30px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pop-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.x{background:none;border:0;font-size:28px;line-height:1;color:var(--muted);cursor:pointer}
@media(max-width:700px){.pre{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row label{grid-column:1/-1}.pop{padding:0 18px 18px}.stk{padding:18px 18px 8px;margin:0 -18px 12px}.dv{padding-top:18px}.sl{grid-template-columns:28px 1fr 64px;gap:6px}}
.stk{position:sticky;top:0;z-index:5;background:var(--card);padding:26px 30px 10px;margin:0 -30px 14px;border-bottom:1px solid var(--line)}
.stk .pop-h{margin-bottom:14px}.stk .steps{margin-bottom:0}
.acts{display:flex;gap:8px;align-items:center}.dv{padding-top:26px}
button.st{background:none;border:0;font:inherit;font-size:13px;cursor:pointer;padding:0}.st.lock{opacity:.55}
.fl{display:inline-flex;line-height:0}.fi{width:22px;height:22px;border-radius:4px;vertical-align:middle;object-fit:cover}.sl .fi{width:28px;height:28px}.chip .fi{width:16px;height:16px;margin-right:2px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.sh span{color:var(--muted);font-size:13px}
.sl{display:grid;grid-template-columns:30px 1fr 84px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sl small{display:block;color:var(--muted);font-size:12px}.sl .sv{text-align:right}
.sl.hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:0;padding:0 0 4px}
.dtr{display:grid;grid-template-columns:1fr 160px;gap:12px}.dt{position:relative}.dt input{padding-left:44px;position:relative}.wk .ci{pointer-events:none}.ci{position:absolute;left:0;top:0;bottom:0;width:44px;background:none;border:0;color:var(--side);cursor:pointer;display:grid;place-items:center;padding:0;border-radius:8px 0 0 8px;z-index:2}.ci:hover{background:var(--tint)}.dt input::-webkit-calendar-picker-indicator{position:absolute;left:0;top:0;width:44px;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
</style></head><body>
<div id="page"><button class="btn" id="open" hidden onclick="openM()">Open session setup</button></div>
<div class="ov" id="ov"><div class="pop" id="v" role="dialog" aria-modal="true" aria-label="Session setup"></div></div>
<div id="t" role="status"></div>

function wiz(){return`<div class="stk"><div class="pop-h"><div><h2 style="margin:0">Set up ${esc(S.d.name)}</h2><p class="s" style="margin:2px 0 0">Customize this assignment for your course.</p></div><div class="acts">${S.step?`<button class="btn ghost sm" onclick="goStep(${S.step-1})">Back</button>`:""}<button class="btn sm ${S.step<2?"off":""}" id="nx2" onclick="${S.step==2?"publish()":"next()"}">${S.step==2?"Publish session":"Continue"}</button><button class="x" aria-label="Close" onclick="closeM()">×</button></div></div>${steps()}</div>`+[w0,w1,w2][S.step]()}
function w0(){const d=S.d;let h=`<h2>Currencies</h2><p class="s">Choose the currencies students can explore.</p>`;
h+=`<label class="l">Currencies students can explore</label>`+[["all","Every available currency","Students can use all ${CUR.length} currencies."],["preset","Use a preset","Pick a ready-made combination."],["custom","Personalize","Choose currencies by continent."]].map(o=>`<label class="opt"><input type="radio" name="m" ${d.mode==o[0]?"checked":""} onchange="S.d.mode='${o[0]}';render()"><span>${o[1]}<small>${o[2].replace("${CUR.length}",CUR.length)}</small></span></label>`).join("");
if(d.mode=="preset")h+=`<div class="pre">`+PRE.map((p,i)=>`<button class="pc ${d.pre===i?"on":""}" onclick="S.d.pre=${i};render()"><b>${p[0]}</b><small>${p[1]}</small>${p[2].map(c=>`<span class="chip">${fl(c)} ${c}</span>`).join("")}</button>`).join("")+`</div>`;
if(d.mode=="custom")h+=`<p class="s" style="color:var(--side);margin:12px 0 4px">${CUR.length} currencies available</p>`+CONT.map(c=>`<div class="acc"><button onclick="S.open['${c}']=!S.open['${c}'];render()">${c}<span>${S.open[c]?"▴":"▾"}</span></button>`+(S.open[c]?CUR.filter(x=>x[2]==c).map(x=>{const s=d.sel[x[0]];return`<div class="row"><label><input type="checkbox" ${s?"checked":""} onchange="this.checked?S.d.sel['${x[0]}']={a:''}:delete S.d.sel['${x[0]}'];render()"><span class="fl">${fl(x[0])}</span>${x[1]}</label><span>Amount: <input type="number" min="0" ${s?"":'readonly tabindex="-1" onclick="needChk(\''+x[0]+'\')"'} value="${s?s.a:""}" placeholder="0" oninput="S.d.sel['${x[0]}'].a=this.value;upd()"></span><div class="hint" id="h_${x[0]}">Check the box next to the currency to add an amount.</div></div>`}).join(""):"")+`</div>`).join("");
return h+`<div class="sum" id="sum"></div>`+foot("Cancel","closeM()","nx","next()")}
function dtRow(lbl,k){const d=S.d;return`<label class="l" for="${k}d">${lbl}</label><div class="dtr"><div class="dt"><button type="button" class="ci" aria-label="Open calendar" onclick="pk('${k}d')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg></button><input type="date" id="${k}d" value="${d[k+"d"]}" onchange="setDT('${k}d',this.value)"></div><input type="time" id="${k}t" aria-label="${lbl} time" value="${d[k+"t"]}" onchange="setDT('${k}t',this.value)"></div>`}
function pk(id){const e=$(id);try{e.showPicker()}catch(x){e.focus()}}
function setDT(k,v){const d=S.d,df={ft:"08:00",tt:"23:59"};d[k]=v||df[k]||"";if(!v&&df[k])$(k).value=df[k];d.from=d.fd?d.fd+"T"+d.ft:"";d.to=d.td?d.td+"T"+d.tt:"";upd()}
function needChk(k){const h=$("h_"+k);if(!h)return;h.classList.add("on");clearTimeout(h.t);h.t=setTimeout(()=>h.classList.remove("on"),2600)}
function w1(){return`<h2>Schedule assignment</h2><p class="s">Choose when students can begin and end.</p>`+dtRow("Available from","f")+dtRow("To","t")+foot("Back","S.step=0;render()","nx","next()")}
function w2(){const d=S.d,c=chosen();return`<h2>Review assignment</h2><p class="s">Check everything before publishing.</p>
<div class="rv"><div><small>Section name</small>${esc(d.name)}</div></div>
<div class="rv"><div style="flex:1"><small>Currencies available</small>${lst(c,1)}</div><button class="ed" onclick="S.step=0;render()">Edit</button></div>
<div class="rv"><div><small>Available date</small>${fmt(d.from)}</div><button class="ed" onclick="S.step=1;render()">Edit</button></div>
<div class="rv"><div><small>Closing date</small>${fmt(d.to)}</div><button class="ed" onclick="S.step=1;render()">Edit</button></div>`+foot("Back","S.step=1;render()","","publish()","Publish session")}
function foot(bl,ba,id,na,nl="Continue"){return`<div class="foot"><button class="btn ghost" onclick="${ba}">${bl}</button><button class="btn ${id?"off":""}" ${id?`id="${id}"`:""} onclick="${na}">${nl}</button></div><div class="err" id="er"></div>`}
function msg(e){document.querySelectorAll(".err").forEach(x=>x.textContent=e);toast(e)}
function goStep(j){if(j==S.step)return;if(j>S.step){const E=[curErr,schErr];for(let k=0;k<j;k++){const e=E[k]();if(e){msg(e);return}}}S.step=j;render();$("v").scrollTop=0}
function next(){const e=S.step==0?curErr():schErr();if(e){msg(e);return}goStep(S.step+1)}
function publish(){const d=S.d,code=Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("");
S.sessions.push({name:d.name.trim(),code,cur:chosen(),from:d.from,to:d.to,students:[]});S.cur=S.sessions.length-1;S.tab="setup";toast("Session published.");go("detail")}
function detail(){const s=S.sessions[S.cur];let b="";
if(S.tab=="setup")b=`<div class="rv"><div style="flex:1"><h3>Currencies</h3>${lst(s.cur,1)}</div><button class="ed" onclick="toast('Editing is not part of this mockup.')">Edit</button></div><div class="rv"><div><h3>Dates</h3>Available: ${fmt(s.from)}<br>Closes: ${fmt(s.to)}</div><button class="ed" onclick="toast('Editing is not part of this mockup.')">Edit</button></div>`;
else if(S.tab=="scores")b=s.students.length?`<table><tr><th>Student</th><th>Portfolio value</th><th>Trades</th></tr>`+s.students.map((n,i)=>`<tr><td>${n}</td><td>$${(1100-i*85).toLocaleString()}</td><td>${12-i*3}</td></tr>`).join("")+`</table>`:`<p class="s">No scores yet. Scores appear once students start trading.</p>`;
else b=s.students.length?`<table><tr><th>Students who joined</th></tr>`+s.students.map(n=>`<tr><td>${n}</td></tr>`).join("")+`</table>`:`<p class="s">No students have joined yet. Share the link to invite them.</p>`;
return`<div class="dv"><div class="top"><div style="display:flex;gap:10px;align-items:center"><div><h1 style="margin:0">${esc(s.name)}</h1><span class="s">Foreign Exchange Lab</span></div></div><span><button class="btn" onclick="share()">Share link</button> <button class="x" aria-label="Close" onclick="closeM()">×</button></span></div>
<div class="tabs">${[["setup","Setup"],["scores","Scores"],["students","Students"]].map(t=>`<button class="${S.tab==t[0]?"on":""}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>${b}</div>`}
function share(){const s=S.sessions[S.cur],u="https://fxlab.example.edu/join/"+s.code,m=document.createElement("div");m.className="mo";m.onclick=e=>{if(e.target==m)m.remove()};
m.innerHTML=`<div role="dialog" aria-label="Share link" style="width:min(440px,90vw)"><h2>Share this link</h2><p class="s" style="margin:0">Students open it to join your session.</p><input type="text" readonly value="${u}" onfocus="this.select()" style="margin:14px 0 18px;text-align:center"><button class="btn" id="cp">Copy link</button> <button class="btn ghost" id="cl">Close</button></div>`;
document.body.appendChild(m);$("cl").onclick=()=>m.remove();$("cp").onclick=()=>{try{navigator.clipboard.writeText(u)}catch(e){}toast("Link copied.")}}
function closeM(){$("ov").classList.add("hide");$("open").hidden=false}
function openM(){S.d=blank();S.step=0;S.view="wiz";$("ov").classList.remove("hide");$("open").hidden=true;render()}
if(/AppleWebKit/.test(navigator.userAgent))document.body.classList.add('wk');
render();
</script></body></html>
